name: Token usage card

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: token-usage-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch token statistics
        id: stats
        env:
          TOKEN_HUB_MONITOR: ${{ secrets.TOKEN_HUB_MONITOR }}
        run: |
          TOKEN_STATS_ENDPOINT="https://token-monitor-hub.thefatinsect.workers.dev/api/stats"
          if [ -z "$TOKEN_HUB_MONITOR" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Set TOKEN_HUB_MONITOR to enable token usage card updates."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            "$TOKEN_STATS_ENDPOINT" \
            -H "Authorization: Bearer $TOKEN_HUB_MONITOR" \
            -H "Content-Type: application/json" \
            --output "$RUNNER_TEMP/token-stats.json"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Generate SVG
        if: steps.stats.outputs.enabled == 'true'
        run: node scripts/generate-token-stats.js "$RUNNER_TEMP/token-stats.json" assets/token-usage.svg

      - name: Commit updated card
        if: steps.stats.outputs.enabled == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/token-usage.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update token usage card"
          git push
